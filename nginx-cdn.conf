# CDN-optimized Nginx configuration for static assets
# This config should be included in the main server block or used as a reference
# for configuring CloudFlare/AWS CloudFront CDN origin settings.

# Static asset caching - aggressive cache for hashed filenames
location /assets/ {
    alias /home/administrator/whatsapp-chat/backend/public/dist/assets/;
    
    # CDN cache headers: 1 year for content-hashed assets
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    add_header X-CDN-Cache "HIT";
    
    # Enable gzip compression for text-based assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    
    # Enable Brotli if available
    # brotli on;
    # brotli_types text/css application/javascript application/json image/svg+xml;
    
    access_log off;
}

# Media files (uploads, profile photos, etc.)
location /uploads/ {
    alias /home/administrator/whatsapp-chat/backend/public/uploads/;
    
    # Moderate cache: 7 days for user-uploaded content
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff";
    
    access_log off;
}

# APK downloads
location /downloads/ {
    alias /home/administrator/whatsapp-chat/backend/public/downloads/;
    
    # Short cache: 1 hour for APK (may be updated)
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    
    access_log off;
}

# Favicon and manifest
location ~* \.(ico|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# HTML files - no cache (always serve fresh)
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

# Security headers (applied globally)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
