# Nginx config for ChatApp
# Install: cp deploy/nginx-chatapp.conf /etc/nginx/sites-enabled/chatapp
# Cloudflare terminates SSL on port 443, proxies to nginx on port 8080
# Nginx reverse-proxies API/WebSocket/PeerJS to NestJS on port 3000

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name 104.219.250.32 abhi.so;

    root /opt/chatapp/web;
    index index.html;

    # SPA fallback - serve index.html for any route not found
    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        rewrite .* /index.html last;
    }

    location = /index.html {
        root /opt/chatapp/web;
        internal;
    }

    # API proxy
    location /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /users {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /chats {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Uploads (APK downloads, media) - serve directly from filesystem
    location /uploads {
        alias /opt/chatapp/backend/uploads;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition "attachment" always;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # PeerJS (mounted as Express middleware on port 3000)
    location /peer {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Socket.IO
    location /socket.io {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
