# Instructions for enabling HTTPS with Let's Encrypt:
# 1. Install certbot on the server: apt install certbot
# 2. Stop nginx: docker-compose stop web
# 3. Get certificate: certbot certonly --standalone -d yourdomain.com
# 4. Copy certificates to a mounted volume
# 5. Update docker-compose.yml to mount the certificates
# 6. Uncomment the HTTPS server block above
# 7. Restart: docker-compose up -d
